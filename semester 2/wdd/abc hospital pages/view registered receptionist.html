<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Receptionists</title>
    <style>
        body {
            font-family: 'Geneva', sans-serif;
            background-color: #fff0f5;
            color: #333;
        }
        .receptionists-table {
            margin: 50px auto;
            width: 80%;
            border-collapse: collapse;
        }
        table {
            width: 100%;
            border: 1px solid #ddd;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #8b008b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="receptionists-table">
        <h2>Registered Receptionists</h2>
        <table>
            <tr>
                <th>Receptionist Name</th>
                <th>Email</th>
            </tr>
            <tr>
                <td>John Adams</td>
                <td>adams@hospital.com</td>
            </tr>
            <tr>
                <td>Jane Clark</td>
                <td>clark@hospital.com</td>
            </tr>
        </table>
    </div>
</body>
</html>
