<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Doctors</title>
    <style>
        body {
            font-family: 'Calibri', sans-serif;
            background-color: #e6ffe6;
            color: #333;
        }
        .doctors-table {
            margin: 50px auto;
            width: 80%;
            border-collapse: collapse;
        }
        table {
            width: 100%;
            border: 1px solid #ddd;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #006400;
            color: white;
        }
    </style>
</head>
<body>
    <div class="doctors-table">
        <h2>Registered Doctors</h2>
        <table>
            <tr>
                <th>Doctor Name</th>
                <th>Specialization</th>
                <th>Email</th>
            </tr>
            <tr>
                <td>Dr. Smith</td>
                <td>Cardiology</td>
                <td>smith@hospital.com</td>
            </tr>
            <tr>
                <td>Dr. Jones</td>
                <td>Neurology</td>
                <td>jones@hospital.com</td>
            </tr>
        </table>
    </div>
</body>
</html>
