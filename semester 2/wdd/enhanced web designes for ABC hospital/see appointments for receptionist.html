<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist - View Appointments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>All Appointments</h2>
        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Doctor Name</th>
                    <th>Reason</th>
                    <th>Date and Time</th>
                    <th>Contact Number</th>
                    <th>Confirmation Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Example data -->
                <tr>
                    <td>Jane Smith</td>
                    <td>Dr. John Doe</td>
                    <td>Consultation</td>
                    <td>2024-11-02 10:00</td>
                    <td>555-5678</td>
                    <td>Confirmed</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
