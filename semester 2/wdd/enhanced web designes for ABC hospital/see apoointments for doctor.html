<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor - See Appointments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Appointments for Dr. [Name]</h2>
        <table>
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>Date and Time</th>
                    <th>Reason</th>
                    <th>Contact Number</th>
                </tr>
            </thead>
            <tbody>
                <!-- Example data -->
                <tr>
                    <td>Jane Smith</td>
                    <td>2024-11-02 14:00</td>
                    <td>Follow-up</td>
                    <td>555-1234</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
