<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Doctor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Register New Doctor</h2>
        <form action="submit-doctor.html" method="post">
            <input type="text" placeholder="Doctor Name" required>
            <input type="text" placeholder="Specialized In" required>
            <input type="tel" placeholder="Contact Number" required>
            <input type="text" placeholder="New Doctor ID" required>
            <input type="password" placeholder="New Password" required>
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
